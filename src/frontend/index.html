<!doctype html>
<html lang="fr" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- CEO-Pay icon. New filename + ?v= so browsers do not reuse a cached old favicon. -->
    <link rel="icon" href="/ceo-pay-icon.svg?v=2" type="image/svg+xml" />
    <link rel="icon" href="/ceo-pay-icon-32.png?v=2" type="image/png" sizes="32x32" />
    <link rel="icon" href="/ceo-pay-icon-192.png?v=2" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" sizes="180x180" />
    <meta name="description" content="CEO-Pay : pilotage intelligent des encaissements électroniques." />
    <meta name="application-name" content="CEO-Pay" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <title>CEO-Pay</title>
    <script>
      // apply the saved/system theme before first paint (no flash)
      try {
        const t = localStorage.getItem("mp-theme") || "system";
        const dark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
